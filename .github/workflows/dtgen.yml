name: Generate AOSP Device Tree

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install aospdtgen
        run: |
          pip install aospdtgen
          
      - name: Extract ZIP & Run Payload Dumper
        run: |
          cd workspace/firmware
          
          # Ekstrak recovery.zip kalau payload.bin belum ada
          if [ ! -f "payload.bin" ]; then
            echo "Ekstrak recovery.zip..."
            unzip -o recovery.zip
          fi
          
          # Jalankan payload-dumper-go kalau folder extracted_images belum ada
          if [ ! -d "extracted_images" ]; then
            echo "Dumping payload.bin..."
            mkdir -p extracted_images
            payload-dumper-go -o extracted_images payload.bin
          fi
          
          cd ../..
          

      - name: Run Payload Dumper & aospdtgen
        run: |
          # Asumsi file payload.bin ada di folder workspace/firmware/
          cd workspace/firmware
          
          # Kalau payload-dumper-go udah lu sediakan atau mau dipanggil langsung
          # Pastikan hasil dump masuk ke folder extracted_images
          if [ ! -d "extracted_images" ]; then
            mkdir -p extracted_images
            payload-dumper-go -o extracted_images payload.bin
          fi
          
          cd ../..

      - name: Run aospdtgen
        run: |
          python3 -m aospdtgen workspace/firmware/extracted_images -o device/xiaomi/serenity

      - name: Push Generated Tree to Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add device/
          git commit -m "chore: auto-generate device tree serenity"
          git push
          
